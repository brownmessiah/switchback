name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    name: Unit + Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
        env:
          # placeholder values so lib/env.ts validates in CI;
          # real values are injected via repo secrets in deploy workflows
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-only-ci-only-ci-only-ci-only-ci
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-report
          path: coverage/

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # The full 374-test suite runs serially (workers: 1 under CI) against an
    # on-demand-compiling Next dev server, with up to 2 retries per test — well
    # over the previous 15-minute budget once the dev server is actually live.
    timeout-minutes: 40
    # The E2E harness manages its own database: global-setup connects to the
    # `postgres` maintenance DB (derived from DATABASE_URL), drops/recreates
    # `outvers_e2e`, runs `drizzle-kit push`, and seeds it. The Next dev server
    # (`pnpm dev`, started by Playwright's webServer) inherits this job's
    # DATABASE_URL and serves the same `outvers_e2e` DB. So DATABASE_URL must
    # point at `outvers_e2e`: maintenance ops resolve to `/postgres`, push/seed
    # and the dev server resolve to `/outvers_e2e`. All three stay aligned.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: 'true'
          # Headroom for the on-demand-compiling Next dev server on a 7GB runner;
          # a cold dev server compiling 45 routes while serving the suite can
          # otherwise OOM/stall and start refusing connections mid-run.
          NODE_OPTIONS: --max-old-space-size=4096
          # Point at outvers_e2e: the harness swaps the db name to `postgres`
          # for DROP/CREATE, and push/seed + the dev server use outvers_e2e.
          DATABASE_URL: postgres://ci:ci@localhost:5432/outvers_e2e
          BETTER_AUTH_SECRET: ci-only-ci-only-ci-only-ci-only-ci
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          # Deterministic Razorpay / Razorpay X demo stub (lib/payments) — the
          # payout-batch + provisioning + webhook specs run against fake responses
          # (pout_demo_/fa_demo_ ids, signature bypass). Test-only constants; no
          # real money path. Without these the dev server can't run the money loop.
          RAZORPAY_TEST_MODE: 'true'
          # The payout-batch cron route is env-gated OFF (404) unless RUN_CRON_ROUTES
          # is 'true'; the spec drives it via Bearer CRON_SECRET. Test-only values
          # that MUST match tests/e2e/specs/admin/payout-batch-loop.spec.ts.
          RUN_CRON_ROUTES: 'true'
          CRON_SECRET: e2e-cron-secret
          RAZORPAYX_WEBHOOK_SECRET: e2e-razorpayx-webhook-secret
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Auto-deploy to Cloud Run on merge to main (ADR-0019), gated behind the FULL CI
  # suite: lint + typecheck + unit (with the 90% money-path coverage gate) + e2e.
  # Safety net: tagged --no-traffic → smoke → shift, so a bad revision never
  # serves. Rollback (no rebuild):
  #   gcloud run services update-traffic outvers-web --region asia-south1 \
  #     --to-revisions PREVIOUS_REVISION=100
  deploy:
    name: Deploy (Cloud Run)
    needs: [lint, typecheck, unit, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: outvers-adventure
      REGION: asia-south1
      AR_REPO: outvers
      WEB_SERVICE: outvers-web
      CRON_SERVICE: outvers-cron
      MIGRATE_JOB: outvers-migrate
      SQL_INSTANCE: outvers-pg
    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/695802542841/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: gh-deployer@outvers-adventure.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build + push image
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/app"
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL="${{ vars.APP_URL }}" \
            -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          echo "IMAGE=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Pre-migrate backup
        run: |
          gcloud sql backups create --instance="${SQL_INSTANCE}" \
            --project="${PROJECT_ID}" --description="pre-migrate ${GITHUB_SHA}"

      - name: Run migrations (Cloud Run Job)
        run: |
          set -euo pipefail
          gcloud run jobs update "${MIGRATE_JOB}" --image "${IMAGE}" \
            --region "${REGION}" --project "${PROJECT_ID}"
          gcloud run jobs execute "${MIGRATE_JOB}" --region "${REGION}" \
            --project "${PROJECT_ID}" --wait

      - name: Deploy web (no-traffic + tag) → smoke → shift 100%
        run: |
          set -euo pipefail
          TAG="sha-${GITHUB_SHA::8}"
          gcloud run deploy "${WEB_SERVICE}" --image "${IMAGE}" \
            --region "${REGION}" --project "${PROJECT_ID}" \
            --no-traffic --tag "${TAG}"
          TAGGED_URL=$(gcloud run services describe "${WEB_SERVICE}" \
            --region "${REGION}" --project "${PROJECT_ID}" --format=json \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print(next(t['url'] for t in d['status']['traffic'] if t.get('tag')=='${TAG}'))")
          echo "Smoke-testing ${TAGGED_URL}"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 5 "${TAGGED_URL}/api/healthz"
          curl -fsS -o /dev/null "${TAGGED_URL}/"
          gcloud run services update-traffic "${WEB_SERVICE}" --to-latest \
            --region "${REGION}" --project "${PROJECT_ID}"

      - name: Deploy cron service
        run: |
          gcloud run deploy "${CRON_SERVICE}" --image "${IMAGE}" \
            --region "${REGION}" --project "${PROJECT_ID}"
