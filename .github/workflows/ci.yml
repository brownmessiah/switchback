name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    name: Unit + Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
        env:
          # placeholder values so lib/env.ts validates in CI;
          # real values are injected via repo secrets in deploy workflows
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-only-ci-only-ci-only-ci-only-ci
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-report
          path: coverage/

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: 'true'
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-only-ci-only-ci-only-ci-only-ci
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Auto-deploy to Cloud Run on merge to main (ADR-0019). Gated behind the
  # deterministic, infra-free jobs (lint/typecheck/unit). The Playwright e2e job
  # needs a live DB it doesn't provision in CI, so the REAL end-to-end gate is the
  # live-URL validation against the deployed app (#15) — per the ADR, "infra/CI are
  # proven by the live E2E loop". Safety net: tagged --no-traffic → smoke → shift,
  # so a bad revision never serves. Rollback (no rebuild):
  #   gcloud run services update-traffic outvers-web --region asia-south1 \
  #     --to-revisions PREVIOUS_REVISION=100
  deploy:
    name: Deploy (Cloud Run)
    needs: [lint, typecheck, unit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: outvers-adventure
      REGION: asia-south1
      AR_REPO: outvers
      WEB_SERVICE: outvers-web
      CRON_SERVICE: outvers-cron
      MIGRATE_JOB: outvers-migrate
      SQL_INSTANCE: outvers-pg
    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/695802542841/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: gh-deployer@outvers-adventure.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build + push image
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/app"
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL="${{ vars.APP_URL }}" \
            -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          echo "IMAGE=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Pre-migrate backup
        run: |
          gcloud sql backups create --instance="${SQL_INSTANCE}" \
            --project="${PROJECT_ID}" --description="pre-migrate ${GITHUB_SHA}"

      - name: Run migrations (Cloud Run Job)
        run: |
          set -euo pipefail
          gcloud run jobs update "${MIGRATE_JOB}" --image "${IMAGE}" \
            --region "${REGION}" --project "${PROJECT_ID}"
          gcloud run jobs execute "${MIGRATE_JOB}" --region "${REGION}" \
            --project "${PROJECT_ID}" --wait

      - name: Deploy web (no-traffic + tag) → smoke → shift 100%
        run: |
          set -euo pipefail
          TAG="sha-${GITHUB_SHA::8}"
          gcloud run deploy "${WEB_SERVICE}" --image "${IMAGE}" \
            --region "${REGION}" --project "${PROJECT_ID}" \
            --no-traffic --tag "${TAG}"
          TAGGED_URL=$(gcloud run services describe "${WEB_SERVICE}" \
            --region "${REGION}" --project "${PROJECT_ID}" --format=json \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print(next(t['url'] for t in d['status']['traffic'] if t.get('tag')=='${TAG}'))")
          echo "Smoke-testing ${TAGGED_URL}"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 5 "${TAGGED_URL}/api/healthz"
          curl -fsS -o /dev/null "${TAGGED_URL}/"
          gcloud run services update-traffic "${WEB_SERVICE}" --to-latest \
            --region "${REGION}" --project "${PROJECT_ID}"

      - name: Deploy cron service
        run: |
          gcloud run deploy "${CRON_SERVICE}" --image "${IMAGE}" \
            --region "${REGION}" --project "${PROJECT_ID}"
